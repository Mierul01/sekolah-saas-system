<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sm-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2456a3"/>
      <stop offset="0.55" stop-color="#123266"/>
      <stop offset="1" stop-color="#0b1f3f"/>
    </linearGradient>
    <linearGradient id="sm-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sm-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#eaa03a"/>
    </linearGradient>
    <linearGradient id="sm-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c9e4"/>
      <stop offset="1" stop-color="#93a9cf"/>
    </linearGradient>
    <linearGradient id="sm-col" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f1f5fb"/>
      <stop offset="1" stop-color="#c9d5e8"/>
    </linearGradient>
    <linearGradient id="sm-door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4180"/>
      <stop offset="1" stop-color="#0b1f3f"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect width="64" height="64" rx="15" fill="url(#sm-bg)"/>
  <path d="M0 15A15 15 0 0 1 15 0h34a15 15 0 0 1 15 15v9C44 18 20 18 0 26z" fill="url(#sm-gloss)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- ground shadow -->
  <ellipse cx="32" cy="52.2" rx="23" ry="2.6" fill="#000000" opacity="0.28"/>

  <!-- flag -->
  <rect x="31.4" y="6.2" width="1.2" height="9.6" rx="0.5" fill="#e9eef7"/>
  <path d="M32.6 6.8h7.2l-1.9 2.3 1.9 2.3h-7.2z" fill="#e5484d"/>

  <!-- roof (pediment) with clock -->
  <path d="M9.5 25.2L32 14.2l22.5 11z" fill="url(#sm-roof)"/>
  <path d="M9.5 25.2L32 14.2l22.5 11h-3.4L32 16.1 12.9 25.2z" fill="#ffffff" opacity="0.25"/>
  <rect x="9.5" y="25.2" width="45" height="3" fill="#c47a18"/>
  <circle cx="32" cy="21.3" r="3.1" fill="#ffffff" stroke="#0f2a56" stroke-width="0.8"/>
  <path d="M32 19.5v1.9l1.3.9" fill="none" stroke="#0f2a56" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wall -->
  <rect x="12" y="28.2" width="40" height="17.8" fill="url(#sm-wall)"/>

  <!-- columns -->
  <g fill="url(#sm-col)">
    <rect x="13.6" y="28.2" width="4.4" height="17.8"/>
    <rect x="21.6" y="28.2" width="4.4" height="17.8"/>
    <rect x="38" y="28.2" width="4.4" height="17.8"/>
    <rect x="46" y="28.2" width="4.4" height="17.8"/>
  </g>
  <g fill="#ffffff">
    <rect x="12.9" y="28.2" width="5.8" height="1.4" rx="0.3"/>
    <rect x="20.9" y="28.2" width="5.8" height="1.4" rx="0.3"/>
    <rect x="37.3" y="28.2" width="5.8" height="1.4" rx="0.3"/>
    <rect x="45.3" y="28.2" width="5.8" height="1.4" rx="0.3"/>
  </g>

  <!-- door -->
  <path d="M28 46V36.6a4 4 0 0 1 8 0V46z" fill="url(#sm-door)"/>
  <path d="M32 32.6V46" stroke="#f2a93b" stroke-width="0.7" opacity="0.8"/>

  <!-- steps -->
  <rect x="10.5" y="45.6" width="43" height="2.6" rx="0.6" fill="#eef2f9"/>
  <rect x="8.5" y="48" width="47" height="2.8" rx="0.7" fill="#c3cfe3"/>

  <!-- shrubs either side of the steps -->
  <g>
    <circle cx="9" cy="47.4" r="3.6" fill="#1f8a5b"/>
    <circle cx="11.8" cy="48.6" r="2.7" fill="#29a56d"/>
    <circle cx="8" cy="46.4" r="1.6" fill="#4cc48b" opacity="0.7"/>
    <circle cx="55" cy="47.4" r="3.6" fill="#1f8a5b"/>
    <circle cx="52.2" cy="48.6" r="2.7" fill="#29a56d"/>
    <circle cx="56" cy="46.4" r="1.6" fill="#4cc48b" opacity="0.7"/>
  </g>
</svg>
